<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Класс')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width: 500px;">
    <h1 class="h3 mb-3" th:text="${grade.id == null} ? 'Новый класс' : 'Изменить класс'">Новый класс</h1>

    <form th:object="${grade}"
          th:action="${grade.id == null} ? @{/grade/add} : @{/grade/{id}/edit(id=${grade.id})}"
          method="post" class="bg-white border rounded p-3">
        <div class="mb-3">
            <label for="name" class="form-label">Название</label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   th:errorclass="is-invalid" placeholder="например, 9А">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/grade}" class="btn btn-danger">Отмена</a>
    </form>
</div>
</body>
</html>
